name: Recurring Chores

on:
  schedule:
    # Run twice a week (Sundays and Wednesdays at 00:00 UTC)
    - cron: '0 0 * * 0,3'
  workflow_dispatch: # Allow manual triggering

permissions:
  contents: write
  pull-requests: write

jobs:
  maintenance:
    name: Codebase Maintenance
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: tools/tui/go.mod

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'

      - name: Install dependencies (Go)
        run: |
          cd tools/tui || exit 1
          go mod download

      - name: Install dependencies (Node.js)
        run: |
          cd tools/mcp || exit 1
          npm install

      - name: Update Go dependencies
        run: |
          cd tools/tui || exit 1
          go get -u ./...
          go mod tidy
          go mod verify

      - name: Update Node.js dependencies
        run: |
          cd tools/mcp || exit 1
          npm update
          npm install

      - name: Run Go security audit
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          cd tools/tui || exit 1
          govulncheck ./... || echo "Vulnerabilities found in Go code"

      - name: Run Node.js security audit
        run: |
          cd tools/mcp || exit 1
          npm audit || echo "Vulnerabilities found in Node.js code"

      - name: Project Integrity Check
        run: |
          echo "Verifying core files and personas..."
          [ -f "core/NEXUS.md" ] || exit 1
          [ -d "personas" ] || exit 1
          echo "Checking for broken symlinks..."
          find . -xtype l -print | grep . && exit 1 || echo "No broken symlinks found."

      - name: Cleanup
        run: |
          echo "Cleaning up artifacts and temporary files..."
          rm -rf tools/tui/nexus
          rm -rf tools/tui/tui
          rm -rf .tmp/
          find . -name "*.log" -type f -delete
          echo "Cleanup complete."

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: "chore: weekly maintenance and dependency updates"
          title: "Weekly Maintenance: Dependency Updates & Cleanups"
          body: |
            Automated maintenance tasks completed:
            - Updated Go dependencies in `tools/tui`
            - Updated Node.js dependencies in `tools/mcp`
            - Ran security audits (`govulncheck`, `npm audit`)
            - Verified project integrity
            - Cleaned up artifacts and logs
          branch: chore/weekly-maintenance
          base: main
          labels: maintenance, chore
