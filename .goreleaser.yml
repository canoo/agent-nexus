# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

builds:
  - main: .
    dir: tools/tui
    binary: nexus
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    # Windows support planned for v1.0.0 (#18)
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [binary]
    name_template: "nexus-{{ .Os }}-{{ .Arch }}"

checksum:
  name_template: "checksums.txt"
  # install.sh is uploaded via release.extra_files but GoReleaser only
  # checksums built archives by default; without this entry the TUI's
  # self-update checksum lookup for install.sh always fails.
  extra_files:
    - glob: install.sh

release:
  github:
    owner: canoo
    name: agent-nexus
  extra_files:
    - glob: install.sh
  draft: false
  prerelease: auto

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
